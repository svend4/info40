# Alert Rules for AI Agent Orchestration Platform

groups:
  # ============================================================================
  # Critical Alerts - Immediate Action Required
  # ============================================================================

  - name: critical_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|registry-service|marketplace-service|orchestrator-service"} == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute. Immediate action required."

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: DatabaseDown
        expr: up{service="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database has been unreachable for 1 minute. All services will be affected."

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "High database connection count"
          description: "PostgreSQL has {{ $value }} active connections (threshold: 80)"

      - alert: OutOfMemory
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            /
            node_memory_MemTotal_bytes
          ) > 0.9
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.instance }} is running out of memory"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 90%)"

      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.1
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

  # ============================================================================
  # High Priority Alerts - Urgent Attention Needed
  # ============================================================================

  - name: high_priority_alerts
    interval: 1m
    rules:
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: high
          component: performance
        annotations:
          summary: "High response time on {{ $labels.service }}"
          description: "P95 response time is {{ $value }}s (threshold: 2s)"

      - alert: HighTaskQueueDepth
        expr: task_queue_depth{status="pending"} > 100
        for: 10m
        labels:
          severity: high
          component: orchestrator
        annotations:
          summary: "Task queue depth is high"
          description: "{{ $value }} pending tasks in queue (threshold: 100)"

      - alert: LowAgentAvailability
        expr: count(agent_status{status="active"}) < 10
        for: 5m
        labels:
          severity: high
          component: marketplace
        annotations:
          summary: "Low agent availability"
          description: "Only {{ $value }} active agents available (threshold: 10)"

      - alert: HighTaskFailureRate
        expr: |
          (
            rate(tasks_failed_total[10m])
            /
            rate(tasks_created_total[10m])
          ) > 0.1
        for: 10m
        labels:
          severity: high
          component: orchestrator
        annotations:
          summary: "High task failure rate"
          description: "{{ $value | humanizePercentage }} of tasks are failing (threshold: 10%)"

      - alert: RedisDown
        expr: up{service="redis"} == 0
        for: 2m
        labels:
          severity: high
          component: cache
        annotations:
          summary: "Redis cache is down"
          description: "Redis has been unavailable for 2 minutes"

      - alert: RabbitMQDown
        expr: up{service="rabbitmq"} == 0
        for: 2m
        labels:
          severity: high
          component: messaging
        annotations:
          summary: "RabbitMQ is down"
          description: "Message queue has been unavailable for 2 minutes"

  # ============================================================================
  # Warning Alerts - Monitoring Required
  # ============================================================================

  - name: warning_alerts
    interval: 2m
    rules:
      - alert: ElevatedErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[10m])
            /
            rate(http_requests_total[10m])
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "Elevated error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[10m])
          ) > 1
        for: 10m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Slow response time on {{ $labels.service }}"
          description: "P95 response time is {{ $value }}s (threshold: 1s)"

      - alert: HighCPUUsage
        expr: |
          100 - (
            avg by (instance) (
              irate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100
          ) > 80
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      - alert: HighMemoryUsage
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            /
            node_memory_MemTotal_bytes
          ) > 0.8
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 80%)"

      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration[5m]) > 30
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "Max query duration is {{ $value }}s (threshold: 30s)"

      - alert: LowTaskCompletionRate
        expr: rate(tasks_completed_total[15m]) < 0.1
        for: 15m
        labels:
          severity: warning
          component: orchestrator
        annotations:
          summary: "Low task completion rate"
          description: "Only {{ $value }} tasks/min completing (expected: >0.1)"

      - alert: HighContractCancellationRate
        expr: |
          (
            rate(marketplace_contracts_cancelled_total[1h])
            /
            rate(marketplace_contracts_created_total[1h])
          ) > 0.2
        for: 1h
        labels:
          severity: warning
          component: marketplace
        annotations:
          summary: "High contract cancellation rate"
          description: "{{ $value | humanizePercentage }} of contracts are being cancelled"

  # ============================================================================
  # Agent-Specific Alerts
  # ============================================================================

  - name: agent_alerts
    interval: 2m
    rules:
      - alert: AgentLowSuccessRate
        expr: |
          (
            rate(agent_tasks_completed_total{status="success"}[1h])
            /
            rate(agent_tasks_total[1h])
          ) < 0.9
        for: 1h
        labels:
          severity: warning
          component: agents
        annotations:
          summary: "Agent {{ $labels.agent_name }} has low success rate"
          description: "Success rate is {{ $value | humanizePercentage }} (threshold: 90%)"

      - alert: AgentHighErrorRate
        expr: rate(agent_errors_total[10m]) > 0.5
        for: 10m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: "Agent {{ $labels.agent_name }} has high error rate"
          description: "{{ $value }} errors per minute"

      - alert: AgentResourceExhaustion
        expr: |
          agent_cpu_usage > 95 or
          (agent_memory_usage_bytes / agent_memory_limit_bytes) > 0.95
        for: 5m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: "Agent {{ $labels.agent_name }} resource exhaustion"
          description: "Agent is using >95% of allocated resources"

  # ============================================================================
  # Business Metrics Alerts
  # ============================================================================

  - name: business_alerts
    interval: 5m
    rules:
      - alert: LowMarketplaceActivity
        expr: rate(marketplace_search_requests_total[1h]) < 0.1
        for: 1h
        labels:
          severity: info
          component: business
        annotations:
          summary: "Low marketplace search activity"
          description: "Only {{ $value }} searches per minute in the last hour"

      - alert: NoTasksCreated
        expr: rate(tasks_created_total[30m]) == 0
        for: 30m
        labels:
          severity: info
          component: business
        annotations:
          summary: "No new tasks created"
          description: "No tasks have been created in the last 30 minutes"

      - alert: LowRevenueGeneration
        expr: rate(platform_revenue_total[24h]) < 100
        for: 24h
        labels:
          severity: info
          component: business
        annotations:
          summary: "Low platform revenue"
          description: "Revenue is only ${{ $value }} in last 24h (expected: >$100)"
