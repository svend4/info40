{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}

  # RabbitMQ
  rabbitmq-password: {{ .Values.secrets.rabbitmqPassword | quote }}

  # Grafana
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | quote }}

  # API Keys
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.googleApiKey }}
  google-api-key: {{ .Values.secrets.googleApiKey | quote }}
  {{- end }}

  # Platform secrets
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
{{- end }}
