{{- if .Values.orchestratorService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-service
spec:
  replicas: {{ .Values.orchestratorService.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator-service
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-platform.serviceAccountName" . }}
      containers:
        - name: orchestrator-service
          image: "{{ include "agent-platform.imageRegistry" . }}/{{ .Values.orchestratorService.image.repository }}:{{ .Values.orchestratorService.image.tag }}"
          imagePullPolicy: {{ .Values.orchestratorService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestratorService.service.port }}
          env:
            {{- include "agent-platform.commonEnv" . | nindent 12 }}
            {{- include "agent-platform.apiKeysEnv" . | nindent 12 }}
            - name: SERVICE_NAME
              value: "orchestrator-service"
          envFrom:
            - configMapRef:
                name: platform-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.orchestratorService.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-service
spec:
  type: {{ .Values.orchestratorService.service.type }}
  ports:
    - port: {{ .Values.orchestratorService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agent-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator-service
{{- end }}
