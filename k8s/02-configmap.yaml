---
# ConfigMap с настройками платформы
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
data:
  # Database configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "agent_platform"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # RabbitMQ configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"

  # Platform settings
  PLATFORM_NAME: "AI Agent Orchestration Platform"
  PLATFORM_VERSION: "1.0.0"
  MAX_CONCURRENT_AGENTS: "100"
  DEFAULT_TASK_TIMEOUT: "3600"

  # Marketplace settings
  MARKETPLACE_ENABLED: "true"
  VOLUNTEER_POOL_ENABLED: "true"
  COMMISSION_RATE: "0.10"  # 10% комиссия платформы

  # Security settings
  SANDBOX_ENABLED: "true"
  AUDIT_LOGGING: "true"
  RATE_LIMITING_ENABLED: "true"

  # AI Model settings
  DEFAULT_MODEL: "claude-sonnet-4.5"
  MODEL_PROVIDERS: "anthropic,openai,google"
