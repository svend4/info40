---
# ServiceMonitor для Prometheus (требуется Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-platform-metrics
  namespace: agent-platform
  labels:
    app: agent-platform
spec:
  selector:
    matchLabels:
      component: core
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# PrometheusRule для алертов
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-platform-alerts
  namespace: agent-platform
  labels:
    app: agent-platform
spec:
  groups:
  - name: agent-platform
    interval: 30s
    rules:
    # High CPU Usage
    - alert: HighCPUUsage
      expr: |
        rate(container_cpu_usage_seconds_total{namespace="agent-platform"}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} CPU"

    # High Memory Usage
    - alert: HighMemoryUsage
      expr: |
        container_memory_usage_bytes{namespace="agent-platform"} / container_spec_memory_limit_bytes{namespace="agent-platform"} > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} memory"

    # Pod Restart Rate
    - alert: HighPodRestartRate
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="agent-platform"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod is restarting frequently"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

    # Service Down
    - alert: ServiceDown
      expr: |
        up{namespace="agent-platform"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Service is down"
        description: "Service {{ $labels.job }} in namespace {{ $labels.namespace }} is down"

    # Database Connection Issues
    - alert: DatabaseConnectionIssues
      expr: |
        pg_up{namespace="agent-platform"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Cannot connect to PostgreSQL"
        description: "PostgreSQL database is unreachable"

    # Redis Connection Issues
    - alert: RedisConnectionIssues
      expr: |
        redis_up{namespace="agent-platform"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Cannot connect to Redis"
        description: "Redis cache is unreachable"

    # Task Queue Backup
    - alert: TaskQueueBackup
      expr: |
        rabbitmq_queue_messages{namespace="agent-platform",queue="agent-tasks"} > 1000
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Task queue is backing up"
        description: "There are {{ $value }} messages in the agent-tasks queue"

    # High Agent Failure Rate
    - alert: HighAgentFailureRate
      expr: |
        rate(agent_task_failures_total{namespace="agent-platform"}[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High agent failure rate"
        description: "Agent failure rate is {{ $value | humanizePercentage }}"

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-platform
  namespace: agent-platform
  labels:
    grafana_dashboard: "1"
data:
  agent-platform-dashboard.json: |
    {
      "dashboard": {
        "title": "AI Agent Orchestration Platform",
        "tags": ["agent-platform", "ai", "orchestration"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Active Agents",
            "type": "stat",
            "targets": [
              {
                "expr": "count(agent_status{status=\"active\"})"
              }
            ]
          },
          {
            "title": "Tasks Per Second",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(agent_tasks_total[5m])"
              }
            ]
          },
          {
            "title": "Agent Success Rate",
            "type": "gauge",
            "targets": [
              {
                "expr": "rate(agent_tasks_success[5m]) / rate(agent_tasks_total[5m])"
              }
            ]
          },
          {
            "title": "Average Task Duration",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(agent_task_duration_seconds_bucket[5m]))"
              }
            ]
          },
          {
            "title": "Task Queue Length",
            "type": "graph",
            "targets": [
              {
                "expr": "rabbitmq_queue_messages{queue=\"agent-tasks\"}"
              }
            ]
          },
          {
            "title": "CPU Usage by Service",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"agent-platform\"}[5m])) by (pod)"
              }
            ]
          },
          {
            "title": "Memory Usage by Service",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes{namespace=\"agent-platform\"}) by (pod)"
              }
            ]
          },
          {
            "title": "API Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{namespace=\"agent-platform\"}[5m])"
              }
            ]
          }
        ]
      }
    }

---
# Jaeger для distributed tracing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: agent-platform
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 5775
          protocol: UDP
        - containerPort: 6831
          protocol: UDP
        - containerPort: 6832
          protocol: UDP
        - containerPort: 5778
          protocol: TCP
        - containerPort: 16686
          protocol: TCP
        - containerPort: 14268
          protocol: TCP
        env:
        - name: COLLECTOR_ZIPKIN_HTTP_PORT
          value: "9411"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: agent-platform
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
  - name: jaeger-agent-zipkin-thrift
    port: 5775
    protocol: UDP
    targetPort: 5775
  - name: jaeger-agent-compact
    port: 6831
    protocol: UDP
    targetPort: 6831
  - name: jaeger-agent-binary
    port: 6832
    protocol: UDP
    targetPort: 6832
  - name: jaeger-agent-configs
    port: 5778
    protocol: TCP
    targetPort: 5778
  - name: jaeger-query
    port: 16686
    protocol: TCP
    targetPort: 16686
  - name: jaeger-collector
    port: 14268
    protocol: TCP
    targetPort: 14268
  - name: jaeger-collector-zipkin
    port: 9411
    protocol: TCP
    targetPort: 9411
  selector:
    app: jaeger
