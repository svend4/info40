---
# Secrets для платформы (в production использовать Sealed Secrets или внешний Secret Manager)
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "platform_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # RabbitMQ credentials
  RABBITMQ_USER: "platform"
  RABBITMQ_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # API Keys для AI провайдеров
  ANTHROPIC_API_KEY: "sk-ant-CHANGE_ME"
  OPENAI_API_KEY: "sk-CHANGE_ME"
  GOOGLE_API_KEY: "CHANGE_ME"

  # JWT Secret для аутентификации
  JWT_SECRET: "CHANGE_ME_LONG_RANDOM_STRING"

  # Encryption key для чувствительных данных
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_KEY"

---
# Secret для TLS сертификатов (пример)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: agent-platform
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # Здесь ваш TLS сертификат
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # Здесь ваш приватный ключ
    -----END PRIVATE KEY-----
