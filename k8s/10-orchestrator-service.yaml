---
# Orchestrator Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: agent-platform
  labels:
    app: orchestrator-service
    component: core
spec:
  replicas: 5  # Больше реплик для обработки задач
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
        component: core
    spec:
      containers:
      - name: orchestrator-service
        image: agent-platform/orchestrator-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        - containerPort: 9092
          name: metrics
        env:
        - name: SERVICE_NAME
          value: "orchestrator-service"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: REDIS_HOST
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: REDIS_PASSWORD
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: RABBITMQ_PASSWORD
        - name: MAX_CONCURRENT_AGENTS
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: MAX_CONCURRENT_AGENTS
        - name: DEFAULT_TASK_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: agent-platform-config
              key: DEFAULT_TASK_TIMEOUT
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-platform-secrets
              key: OPENAI_API_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5

---
# Orchestrator Service ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: agent-platform
  labels:
    app: orchestrator-service
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: metrics
  selector:
    app: orchestrator-service

---
# HorizontalPodAutoscaler для Orchestrator Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-service-hpa
  namespace: agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator-service
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
